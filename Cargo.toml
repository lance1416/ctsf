[workspace]
members = [
    "crates/kernel",
    "crates/kernel-probe",
    "crates/kernel-ffi",
    "crates/uniffi-bindgen",
]
default-members = ["crates/kernel", "crates/kernel-probe"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
kernel = { path = "crates/kernel" }
# Verified 2026-11-02: https://crates.io/api/v1/crates/nix/0.31.3
# The signal feature includes process.
nix = { version = "=0.31.3", default-features = false, features = ["fs", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
uniffi = "=0.32.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
