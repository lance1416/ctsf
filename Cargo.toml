[workspace]
members = [
    "crates/kernel",
    "crates/kernel-probe",
    "crates/kernel-ffi",
    "crates/uniffi-bindgen",
]
default-members = ["crates/kernel", "crates/kernel-probe"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
kernel = { path = "crates/kernel" }
uniffi = "=0.32.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
