name: Setup checks

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: setup-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  git-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v4, resolved from the official tag during setup.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 scripts/test_git_policy.py
      - run: python3 scripts/git_policy.py ci

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - run: python3 scripts/dev.py doctor
      - run: python3 scripts/dev.py format --check
      - run: python3 scripts/dev.py typecheck
      - run: python3 scripts/dev.py lint
      - run: python3 scripts/dev.py test
      - run: python3 scripts/dev.py smoke

  macos-native:
    # This gate intentionally fails until SETUP-C supplies the native project.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: python3 scripts/dev.py doctor
      - run: python3 scripts/dev.py swift-format --check
      - run: python3 scripts/dev.py macos-build
